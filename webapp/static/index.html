<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM Benchmarker</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body>

<header>
  <h1>LLM Benchmarker</h1>
  <span>Local model evaluation — coding, reasoning, context, speed</span>
  <span id="sse-indicator" class="sse-dot disconnected" title="Live updates disconnected"></span>
  <span id="last-synced" class="last-synced"></span>
</header>

<div id="refresh-banner" class="refresh-banner hidden">
  <span>New data available — auto-refreshing in <span id="banner-countdown">60</span>s</span>
  <button id="banner-refresh">Refresh Now</button>
  <button id="banner-cancel">Cancel</button>
</div>

<div id="filters">
  <span class="filter-label">Filters:</span>
  <select id="filter-runtime"><option value="">All runtimes</option></select>
  <select id="filter-arch"><option value="">All architectures</option></select>
  <button id="model-filter-toggle" class="filter-btn">Filter Models ▾</button>
  <div id="model-filter-panel" class="model-filter-panel hidden"></div>
</div>

<nav id="tabs">
  <button class="tab active" data-tab="overview">Overview</button>
  <button class="tab" data-tab="coding">Coding</button>
  <button class="tab" data-tab="reasoning">Reasoning</button>
  <button class="tab" data-tab="recall">Long Context</button>
  <button class="tab" data-tab="speed">Speed</button>
  <button class="tab" data-tab="run">Run</button>
  <button class="tab" data-tab="models">Models</button>
</nav>

<div id="content">

  <div id="tab-overview" class="tab-content active">
    <div class="chart-container">
      <div class="chart-spinner hidden" id="spinner-radar"></div>
      <div id="chart-radar" style="height:500px"></div>
      <div id="score-cards" class="score-cards-container"></div>
    </div>
  </div>

  <div id="tab-coding" class="tab-content">
    <div class="chart-container">
      <div class="chart-spinner hidden" id="spinner-coding-leaderboard"></div>
      <div id="chart-coding-leaderboard" style="height:400px"></div>
    </div>
  </div>

  <div id="tab-reasoning" class="tab-content">
    <div class="chart-container">
      <div class="chart-spinner hidden" id="spinner-reasoning-leaderboard"></div>
      <div id="chart-reasoning-leaderboard" style="height:400px"></div>
      <div id="reasoning-drilldown" class="drilldown-panel hidden">
        <div class="drilldown-header">
          <span class="drilldown-title" id="reasoning-drilldown-title">BBH — Subtask Breakdown</span>
          <select id="bbh-add-model" class="bbh-add-model"><option value="">＋ Add model...</option></select>
          <button class="drilldown-close" id="reasoning-drilldown-close">✕</button>
        </div>
        <div class="chart-spinner hidden" id="spinner-reasoning-drilldown"></div>
        <div id="chart-reasoning-drilldown" style="height:500px"></div>
      </div>
    </div>
  </div>

  <div id="tab-recall" class="tab-content">
    <div class="chart-container">
      <div class="chart-spinner hidden" id="spinner-recall-leaderboard"></div>
      <div id="chart-recall-leaderboard" style="height:400px"></div>
      <div id="recall-drilldown" class="drilldown-panel hidden">
        <div class="drilldown-header">
          <span class="drilldown-title" id="recall-drilldown-title">Recall Depth</span>
          <select id="recall-add-model" class="bbh-add-model"><option value="">＋ Add model...</option></select>
          <button class="drilldown-close" id="recall-drilldown-close">✕</button>
        </div>
        <div class="chart-spinner hidden" id="spinner-recall-depth"></div>
        <div id="chart-recall-depth" style="min-height:300px"></div>
      </div>
    </div>
  </div>

  <div id="tab-speed" class="tab-content">
    <div class="chart-row">
      <div class="chart-container">
        <div class="chart-spinner hidden" id="spinner-speed-curves"></div>
        <div id="chart-speed-curves" style="height:400px"></div>
      </div>
      <div class="chart-container">
        <div class="chart-spinner hidden" id="spinner-speed-bar"></div>
        <div id="chart-speed-bar" style="height:400px"></div>
      </div>
    </div>
  </div>

  <div id="tab-run" class="tab-content">
    <div class="run-config-panel">
      <div class="run-row">
        <label>Model config</label>
        <select id="run-model"></select>
        <label>Corpus (Recall)</label>
        <select id="run-corpus"></select>
      </div>
      <div class="run-row">
        <label>Quantization override</label>
        <input id="run-quant" type="text" placeholder="e.g. Q8_0 (blank = use config)">
        <label>Architecture</label>
        <input id="run-arch" type="text" placeholder="auto-detect" list="arch-datalist">
        <datalist id="arch-datalist"></datalist>
      </div>
      <div class="run-row">
        <label>Benchmarks</label>
        <label class="suite-toggle"><input type="checkbox" id="run-all-toggle" checked> All</label>
        <label class="suite-toggle"><input type="checkbox" value="recall" checked> Recall</label>
        <label class="suite-toggle"><input type="checkbox" value="coding" checked> Coding</label>
        <label class="suite-toggle"><input type="checkbox" value="reasoning" checked> Reasoning</label>
        <label class="suite-toggle"><input type="checkbox" value="speed" checked> Speed</label>
      </div>
      <div class="run-row">
        <button id="run-btn" class="run-btn">&#9654; Run Benchmarks</button>
        <span id="run-note" class="run-note hidden">&#9888; Another run is already active</span>
      </div>
    </div>
    <div id="run-cards"></div>
  </div>

  <div id="tab-models" class="tab-content">
    <div class="models-split">
      <div class="models-sidebar">
        <button id="model-new-btn" class="filter-btn">+ New</button>
        <div id="model-list"></div>
      </div>
      <div id="model-editor" class="model-editor">
        <span class="empty-state">Select a config to edit</span>
      </div>
    </div>
  </div>

</div>

<script src="/static/app.js"></script>
</body>
</html>
