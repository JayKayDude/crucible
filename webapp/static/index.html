<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM Benchmarker</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body>

<header>
  <h1>LLM Benchmarker</h1>
  <span>Local model evaluation — coding, reasoning, context, speed</span>
</header>

<div id="filters">
  <span class="filter-label">Filters:</span>
  <select id="filter-runtime"><option value="">All runtimes</option></select>
  <select id="filter-quant"><option value="">All quantizations</option></select>
  <select id="filter-arch"><option value="">All architectures</option></select>
</div>

<nav id="tabs">
  <button class="tab active" data-tab="overview">Overview</button>
  <button class="tab" data-tab="coding">Coding</button>
  <button class="tab" data-tab="reasoning">Reasoning</button>
  <button class="tab" data-tab="recall">Long Context</button>
  <button class="tab" data-tab="speed">Speed</button>
  <button class="tab" data-tab="quant">Quant Impact</button>
</nav>

<div id="content">

  <div id="tab-overview" class="tab-content active">
    <div class="chart-container">
      <div id="chart-radar" style="height:500px"></div>
    </div>
  </div>

  <div id="tab-coding" class="tab-content">
    <div class="chart-container">
      <div id="chart-coding-leaderboard" style="height:400px"></div>
    </div>
  </div>

  <div id="tab-reasoning" class="tab-content">
    <div class="chart-container">
      <div id="chart-reasoning-leaderboard" style="height:400px"></div>
    </div>
  </div>

  <div id="tab-recall" class="tab-content">
    <div class="chart-container">
      <div id="chart-recall-leaderboard" style="height:400px"></div>
    </div>
    <div class="chart-container">
      <div class="depth-controls">
        <span>Depth chart for run:</span>
        <select id="filter-depth-run"><option value="">select a run</option></select>
      </div>
      <div id="chart-recall-depth" style="height:350px"></div>
    </div>
  </div>

  <div id="tab-speed" class="tab-content">
    <div class="chart-row">
      <div class="chart-container">
        <div id="chart-speed-curves" style="height:400px"></div>
      </div>
      <div class="chart-container">
        <div id="chart-speed-bar" style="height:400px"></div>
      </div>
    </div>
  </div>

  <div id="tab-quant" class="tab-content">
    <div class="quant-controls">
      <span class="filter-label">Model: </span>
      <select id="filter-quant-model"><option value="">select model</option></select>
    </div>
    <div class="chart-container">
      <div id="chart-quant-impact" style="height:400px"></div>
    </div>
  </div>

</div>

<script src="/static/app.js"></script>
</body>
</html>
